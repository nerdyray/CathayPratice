<div class="page-container">

  <div class="header-section">
    <div class="title-group">
      <div class="green-bar"></div>
      <h2>更新店家維護作業</h2>
    </div>

    <div class="action-buttons">
      <!-- <button class="btn btn-outline-green" (click)="onUpdate()">
        <span class="icon">✎</span> 修改
      </button>
      <button class="btn btn-outline-green" (click)="onClear()">
        <span class="icon">⟲</span> 清除
      </button> -->
      <button class="btn btn-outline-green" (click)="onBack()">
        <span class="icon">⬅</span> 回上一頁
      </button>
    </div>
  </div>

  <div class="form-container" [formGroup]="mainForm">

    <div class="form-group">
      <label>店家名稱 <span class="required">*</span></label>
      <input type="text" formControlName="storeName" class="form-control" placeholder="請輸入">
      <div class="error-msg" *ngIf="mainForm.get('storeName')?.invalid && mainForm.get('storeName')?.touched">
        請輸入店家名稱
      </div>
    </div>

    <div class="form-group">
      <label>負責人 <span class="required">*</span></label>
      <input type="text" formControlName="owner" class="form-control" placeholder="請輸入">
    </div>

    <div class="form-group">
      <label>電話</label>
      <input type="text" formControlName="tel" class="form-control" placeholder="請輸入">
    </div>

    <div class="form-group">
      <label>手機</label>
      <input type="text" formControlName="mobile" class="form-control" placeholder="請輸入">
    </div>

    <div class="form-group">
      <label>地址</label>
      <input type="text" formControlName="address" class="form-control" placeholder="請輸入">
    </div>

    <div class="form-group">
      <label>評價</label>
      <select formControlName="evaluation" class="form-control">
        <option value="">請選擇</option>
        <option value="讚">讚</option>
        <option value="普通">普通</option>
        <option value="待加強">待加強</option>
      </select>
    </div>

    <div class="form-group">
      <label>異動日期 <span class="required">*</span></label>
      <input type="text" formControlName="updateDate" class="form-control readonly-field" readonly>
    </div>

  </div>

  @if (showSuccessToast) {
  <div class="toast toast-success">
    <div class="toast-icon">Success</div>
    <div class="toast-msg">修改成功!</div>
    <div class="toast-close" (click)="showSuccessToast=false">×</div>
  </div>
  }

  @if (showErrorToast) {
  <div class="toast toast-error">
    <div class="toast-icon">Fail</div>
    <div class="toast-msg">{{ errorMessage }}</div>
    <div class="toast-close" (click)="showErrorToast=false">×</div>
  </div>
  }

</div>
