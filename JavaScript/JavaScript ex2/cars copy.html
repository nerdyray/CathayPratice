<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>操作DOM物件</title>
</head>
<style>
    .tableList {
        /* 讓表格邊框重疊，看起來更整潔 */
        border-collapse: collapse;
        width: 100%;
    }

    .tableList th,
    .tableList td {
        /* 為表格的每個標題和儲存格加上 1px 的實線框線 */
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
    }
</style>

<body>
    <div>
        <table class="cars" style="border: 1px solid black;">
            <tr>
                <th>製造商</th>
                <th>類別</th>
                <th>底價</th>
                <th>售價</th>
            </tr>
            <tr class="car">
                <td><input type="text" class="detail"></td>
                <td><input type="text" class="detail"></td>
                <td><input type="text" class="detail"></td>
                <td><input type="text" class="detail"></td>
            </tr>
            <tr>
                <td>
                    <button class="add">新增</button>
                    <button class="update">修改</button>
                    <button class="delete">清空</button>
                </td>
            </tr>
        </table>
    </div>
    <table class="tableList">
        <tr class="tableRow">
            <th class="tableHeader"></th>
            <th class="tableHeader">序號</th>
            <th class="tableHeader">製造商</th>
            <th class="tableHeader">類別</th>
            <th class="tableHeader">底價</th>
            <th class="tableHeader">售價</th>
            <th class="tableHeader"></th>
        </tr>
        <tbody class="tableBody"></tbody>
    </table>
</body>
<script src="cars copy.js"></script>

</html>
