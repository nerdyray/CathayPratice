<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>模擬封裝與私有</title>
</head>

<body>
    <div>
        KEY<input type="text" id="KEY" placeholder="輸入KEY">
        VALUE<input type="text" id="VALUE" placeholder="輸入VALUE">
    </div>
    <p>-----------------------------------------------------------</p>
    <div>
        <button id="PUT">PUT</button>
        <button id="CLEAR">CLEAR</button>
    </div>
    <div id="Result"></div>
</body>

<script type="module">
    import { HashMap, key, value } from './HashMap.js';
    
    //新增KEY / VALUE
    document.getElementById("PUT").addEventListener("click", function () {
        const KEY = document.getElementById("KEY").value.trim();
        const VALUE = document.getElementById("VALUE").value.trim();
        HashMap(KEY, VALUE);
        Render();
        console.log(key, value);

    });
    document.getElementById("CLEAR").addEventListener("click", function () {
        Result.innerHTML = '';

    });



    function Render() {
        //清空舊畫面
        Result.innerHTML = '';
        //CreateTitle
        const resultText =
            document.createTextNode('[RESULT]');
        //Create an "ul" node:
        const newDiv = document.createElement('ul');
        newDiv.id = 'RESULT';
        newDiv.className = 'box';
        //for in 遍歷陣列
        for (let i = 0; i < key.length; i++) {
            const ResultKey = document.createElement('li');
            ResultKey.textContent = `KEY:  ${key[i]} 
           VALUE:  ${value[i]}`;
            newDiv.appendChild(ResultKey);
        }
        document.getElementById("Result").appendChild(resultText);
        document.getElementById("Result").appendChild(newDiv);
    }
</script>

</html>
