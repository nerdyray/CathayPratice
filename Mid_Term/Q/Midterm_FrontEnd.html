<!DOCTYPE html>

<head>
    <title>期中測驗</title>
    <script type="text/javascript">
        const suitNameMap = {
            S: "黑桃",
            H: "紅心",
            D: "方塊",
            C: "梅花"
        };

        window.onload = function () {
            var callApi = function callApi(url, param) {
                return fetch(url, {
                    method: 'post',
                    body: JSON.stringify(param),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                }).then(function (response) {
                    return response.json();
                });
            }

            document.getElementById('btnSubmit').addEventListener('click', function () {
                var param = {
                    manCount: 4,
                };
                callApi('http://localhost:8080/midterm/submit', param).then(function (response) {
                    console.log('return msg: ' + response.returnMessage);
                    console.log('metro_fee' + response.metro_fee);
                    console.log(response);
                });
            });

        }


    </script>



</head>

<body>
    <!-- 請輸入 <input type="text" id="name" name="name"> -->
    <button type="button" id="btnSubmit">隨機抽牌</button>
</body>

</html>
