<!DOCTYPE html>

<head>
    <title>期中測驗</title>

    <script type="text/javascript">

        // 花色代碼對照表
        const suitNameMap = {
            S: "黑桃",
            H: "紅心",
            D: "方塊",
            C: "梅花"
        };

        // 將例如 "S10" 轉成 "黑桃10"
        function formatCard(card) {
            // 取第一個字母（花色）
            const suit = card.charAt(0);
            // 剩下的是數字
            const number = card.substring(1);
            return suitNameMap[suit] + number;
        }

        // 清除輸入框與畫面
        function Clear() {
            // 清空人數輸入
            const input = document.getElementById('manCount');
            input.value = '';

            // 清空牌桌顯示
            const cardDiv = document.getElementsByClassName('cardDeck')[0];
            cardDiv.innerHTML = '';
        }

        // 將後端回傳的 players 陣列渲染到畫面
        function Render(players) {

            // 先清空舊畫面
            const cardDiv = document.getElementsByClassName('cardDeck')[0];
            cardDiv.innerHTML = '';

            // 建立 table
            const cardTable = document.createElement('Table');
            cardTable.border = '1';

            // 表頭
            const headerRow = document.createElement('tr');

            const rankTd = document.createElement('td');
            rankTd.textContent = '排名';

            const playerTd = document.createElement('td');
            playerTd.textContent = '玩家';

            const cardTd = document.createElement('td');
            cardTd.textContent = '手牌';

            const scoreTd = document.createElement('td');
            scoreTd.textContent = '總分';

            // 把表格渲染到前端上
            cardDiv.appendChild(cardTable);
            cardTable.appendChild(headerRow);
            headerRow.appendChild(rankTd);
            headerRow.appendChild(playerTd);
            headerRow.appendChild(cardTd);
            headerRow.appendChild(scoreTd);

            // 逐筆玩家資料
            players.forEach((p, index) => {
                // 格式化手牌，例如 S5 → 黑桃5
                const cardsText = p.cards.map(formatCard).join(', ');
                const deckRow = document.createElement('tr');
                deckRow.className = ('deckRow');

                // 使用 template string 形成表格列
                deckRow.innerHTML = `
                <td>第 ${index + 1} 名</td>
                <td>玩家 ${p.player}</td>
                <td>${cardsText}</td>
                <td>${p.score}</td>
                `;
                cardTable.appendChild(deckRow);
            });
        }

        // 畫面讀取完成後開始設定事件
        window.onload = function () {
            // 基本的 POST 呼叫 API 函式
            var callApi = function callApi(url, param) {
                return fetch(url, {
                    method: 'post',
                    body: JSON.stringify(param),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                }).then(function (response) {
                    return response.json(); // 回傳 JSON
                });
            }
            // 清除按鈕
            document.getElementById('clear').addEventListener('click', function () {
                Clear();
            });
            // 自動抽牌（固定 manCount=4）
            document.getElementById('btnSubmit').addEventListener('click', function () {
                var param = { manCount: 4 };
                callApi('http://localhost:8080/midterm/submit', param)
                    .then(function (response) {
                        Render(response.players);
                    });
            });

            // 當移開輸入框
            document.getElementById('manCount').addEventListener('blur', function () {
                this.value = this.value.trim();
            });

            // 手動輸入人數抽牌
            document.getElementById('inputSubmit').addEventListener('click', function () {
                // 取得input輸入的玩家人數
                manCountValue = document.getElementById('manCount').value.trim();

                var param = {
                    manCount: manCountValue
                };

                // 輸入驗證
                if (!manCountValue) {
                    alert('請輸入人數');
                    return;
                }
                
                manCount = Number(manCountValue);
                //人數驗證
                if (manCount > 52 || manCount < 2) {
                    alert('人數必須小於52且大於1');
                    return;
                }
                //輸入型別驗證
                if (Number.isNaN(manCount)) {
                    alert('請輸入數字');
                    return;
                }

                // 呼叫手動輸入人數的API
                callApi('http://localhost:8080/midterm/demoCode', param)
                    .then(function (response) {
                        Render(response.players);
                    });
            });

        }
    </script>

</head>

<body>
    <header>期中作業－抽牌遊戲</header>

    <!-- 固定 4 人隨機抽牌 -->
    <button type="button" id="btnSubmit">隨機抽牌</button>

    <div class="cardDeck">
        <table class="cardTable">
            <tr class="cardRow"></tr>
        </table>
    </div>

    <!-- 手動輸入人數抽牌 -->
    請輸入人數<input type="text" id="manCount">
    <button type="button" id="inputSubmit">抽牌</button>
    <button type="button" id="clear">清除畫面</button>

    <div class="cardDeck1">
        <table class="cardTable1">
            <tr class="cardRow1"></tr>
        </table>
    </div>
</body>

<!-- 簡易置中樣式 -->
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
</style>

</html>
