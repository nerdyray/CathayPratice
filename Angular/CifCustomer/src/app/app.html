<!-- Loading轉圈圈畫面 -->

<div class="global-spinner-overlay" *ngIf="loaderService.isLoading$ | async">
  <div class="spinner">讀取中...</div>
</div>
<!-- Angular Material 的側邊導航容器，作為應用的根佈局 -->
<mat-sidenav-container class="app-container">

  <!--
    側邊導航欄 (Sidebar)
    mode="side" 表示它會推開主內容，而不是覆蓋在上面。
    opened 表示它預設是打開的。
  -->
  <mat-sidenav mode="side" opened class="app-sidebar">

    <!-- 側邊欄標題 -->
    <div class="sidebar-header">
      CIF 管理系統
    </div>

    <!-- 導航列表 -->
    <mat-nav-list>
      <!-- "查詢" 頁面的導航連結 -->
      <!-- routerLinkActive="active-link" 當前路由匹配時，會添加 'active-link' CSS class -->
      <a mat-list-item [routerLink]="['/cif/search001']" routerLinkActive="active-link">
        <mat-icon matListItemIcon>home</mat-icon> <span matListItemTitle>查詢</span>
      </a>

      <!-- "新增" 頁面的導航連結 -->
      <a mat-list-item [routerLink]="['/cif/create']" routerLinkActive="active-link">
        <mat-icon matListItemIcon>add_circle</mat-icon> <span matListItemTitle>新增</span>
      </a>
    </mat-nav-list>

  </mat-sidenav>

  <!--
    主內容區域
    它會被側邊導航欄推開。
  -->
  <mat-sidenav-content class="app-content">
    <!--
      路由器出口
      這是 Angular 路由器渲染當前路由對應組件的地方。
      例如，當 URL 是 /cif/search001 時，Cif001 組件會被渲染在這裡。
    -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
