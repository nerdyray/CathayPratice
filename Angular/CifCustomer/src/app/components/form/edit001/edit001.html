<!-- 主要內容容器 -->
<mat-sidenav-content class="main-content">

  <!-- 頁面標題 -->
  <div class="page-header">
    <span class="green-bar"></span>
    <h2>CIF 修改功能</h2>
  </div>

  <!-- 內容卡片，包含整個表單 -->
  <div class="content-card">
    <!--
      響應式表單容器
      [formGroup]="editForm" 將此 form 元素與 TypeScript 中的 editForm 物件綁定。
      (ngSubmit)="onSubmit()" 當表單提交時，調用 onSubmit 方法。
    -->
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

      <!-- 區域 1: 個人基本資料 (身份證、姓名、性別、學歷) -->
      <div class="form-grid four-cols">
        <!-- 身份證字號 (唯讀) -->
        <div class="field-group">
          <label>身份證字號</label>
          <div class="readonly-text">
            {{ editForm.get('idNum')?.value }}
          </div>
        </div>

        <!-- 中文姓名 -->
        <div class="field-group">
          <label>中文姓名</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="chineseName" placeholder="請輸入姓名">
            <mat-error *ngIf="editForm.get('chineseName')?.hasError('required')">必填</mat-error>
          </mat-form-field>
        </div>

        <!-- 性別 -->
        <div class="field-group">
          <label>性別</label>
          <div class="radio-group-container">
            <mat-radio-group formControlName="gender" color="primary">
              <mat-radio-button value="m">男</mat-radio-button>
              <mat-radio-button value="f">女</mat-radio-button>
            </mat-radio-group>
          </div>
        </div>

        <!-- 學歷 -->
        <div class="field-group">
          <label>學歷</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="education">
              <mat-option value="大學">大學</mat-option>
              <mat-option value="碩士">碩士</mat-option>
              <mat-option value="博士">博士</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <!-- 區域 2: 戶籍地址 -->
      <div class="form-grid address-row">
        <div class="field-group">
          <label>郵遞區號</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="zipCode1" placeholder="請輸入郵遞區碼">
          </mat-form-field>
        </div>

        <div class="field-group span-2">
          <label>戶籍地址</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="address1" placeholder="請輸入地址">
          </mat-form-field>
        </div>

        <div class="field-group">
          <label>戶籍電話</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="telephone1" placeholder="請輸入電話">
          </mat-form-field>
        </div>
      </div>

      <!-- 區域 3: 現居地址，包含 "同戶籍地址" 的邏輯 -->
      <div class="form-grid address-row">
        <div class="field-group">
          <label>郵遞區號</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="zipCode2" placeholder="請輸入郵遞區碼">
          </mat-form-field>
        </div>

        <div class="field-group span-2">
          <label>現居地址</label>
          <div class="flex-row">
            <mat-checkbox formControlName="sameAsAddress1" color="primary">同戶籍地址</mat-checkbox>
            <mat-form-field appearance="outline" class="flex-1" subscriptSizing="dynamic">
              <input matInput formControlName="address2">
            </mat-form-field>
          </div>
        </div>

        <div class="field-group">
          <label>現居電話</label>
          <div class="flex-row">
            <mat-checkbox formControlName="sameAsTelephone1" color="primary">同戶籍電話</mat-checkbox>
            <mat-form-field appearance="outline" class="flex-1" subscriptSizing="dynamic">
              <input matInput formControlName="telephone2">
            </mat-form-field>
          </div>
        </div>
      </div>

      <!-- 區域 4: 聯絡資訊和居住年限 -->
      <div class="form-grid four-cols">
        <div class="field-group">
          <label>行動電話</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="mobile">
          </mat-form-field>
        </div>

        <div class="field-group">
          <label>電子郵件</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="email">
          </mat-form-field>
        </div>

        <div class="field-group span-2">
          <label>現居年限 (至少)</label>
          <div class="slider-group">
            <span class="year-display">{{ editForm.get('year')?.value }} 年</span>
            <mat-slider min="0" max="100" step="1" discrete>
              <input matSliderThumb [formControl]="$any(editForm.get('year'))">
            </mat-slider>
          </div>
        </div>
      </div>

      <!-- 底部操作按鈕區域 -->
      <div class="actions">
        <!-- 儲存按鈕：觸發表單提交。當表單無效時禁用。 -->
        <button mat-flat-button class="save-btn" type="submit" [disabled]="editForm.invalid">
          儲存
        </button>
        <!-- 清除按鈕：點擊時調用 onClear 方法 -->
        <button mat-stroked-button class="outline-green" type="button" (click)="onClear()">
          清除
        </button>
        <!-- 返回按鈕：點擊時調用 onReturn 方法 -->
        <button mat-stroked-button class="outline-green" type="button" (click)="onReturn()">
          返回
        </button>
      </div>

    </form>
  </div>
</mat-sidenav-content>
